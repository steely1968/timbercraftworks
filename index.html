<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timber Craft Works</title>

<style>

/* RESET */
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

/* PAGE */
html {
scroll-behavior: smooth;
}

body {
font-family: Arial, Helvetica, sans-serif;
background: #ffffff;
color: #222222;
line-height: 1.6;
min-height: 100vh;
display: flex;
flex-direction: column;
}

/* HEADER */
header {
width: 100%;
background-color: #000000;
color: #ffffff;
text-align: center;
padding: 30px 15px;
}

header h1 {
color: #ffffff;
font-size: clamp(28px, 5vw, 46px);
font-weight: bold;
letter-spacing: 2px;
margin: 0;
}

header p {
color: #ffffff;
font-size: 16px;
margin-top: 8px;
}

/* MAIN CONTENT */
main {
width: 100%;
max-width: 1200px;
margin: 0 auto;
padding: 35px 20px;
flex: 1;
}

/* HEADINGS */
h2 {
font-size: clamp(22px, 4vw, 32px);
margin-bottom: 15px;
color: #222222;
}

h3 {
margin-bottom: 10px;
}

/* IMAGES */
img {
max-width: 100%;
height: auto;
display: block;
}

/* LINKS */
a {
color: #222222;
text-decoration: none;
}

a:hover {
text-decoration: underline;
}

/* BUTTONS */
button {
background-color: #000000;
color: #ffffff;
border: none;
padding: 12px 24px;
border-radius: 5px;
cursor: pointer;
font-size: 16px;
}

button:hover {
background-color: #333333;
}

/* SECTIONS */
section {
margin-bottom: 35px;
}

/* FOOTER */
footer {
width: 100%;
background-color: #000000;
color: #ffffff;
text-align: center;
padding: 25px 15px;
margin-top: auto;
}

footer p,
footer a {
color: #ffffff;
font-size: 14px;
}

/* MOBILE RESPONSIVE */
@media (max-width: 600px) {

header {
padding: 24px 12px;
}

header h1 {
letter-spacing: 1px;
}

main {
padding: 25px 15px;
}

section {
margin-bottom: 25px;
}

button {
width: 100%;
}
}

</style>
</head>

<body>

<header>
<h1>Timber Craft Works</h1>
<p>Quality Woodworking, Garden Projects & Plans</p>
</header>

<main>

<!-- YOUR WEBSITE CONTENT GOES HERE -->

</main>

<footer>
<p>© 2026 Timber Craft Works. All rights reserved.</p>
</footer>

</body>
</html>
