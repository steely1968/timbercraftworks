<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timber Craft Works - Shed Front Wall Calculator</title>

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: Arial, Helvetica, sans-serif;
background: #f2f2f2;
color: #111;
line-height: 1.5;
}

header {
background: #000;
color: #fff;
text-align: center;
padding: 30px 15px;
}

header h1 {
font-size: clamp(28px, 5vw, 46px);
font-weight: bold;
letter-spacing: 2px;
}

header p {
margin-top: 8px;
font-size: 16px;
}

.container {
width: 100%;
max-width: 1150px;
margin: 30px auto;
padding: 0 15px;
}

.calculator {
background: #fff;
padding: 25px;
border-radius: 10px;
box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

h2 {
font-size: 26px;
margin-bottom: 20px;
}

h3 {
font-size: 21px;
margin: 30px 0 15px;
}

.input-grid {
display: grid;
grid-template-columns: repeat(2, minmax(0, 1fr));
gap: 15px 25px;
}

.input-group {
display: flex;
flex-direction: column;
}

label {
font-weight: bold;
margin-bottom: 6px;
}

input,
select {
width: 100%;
padding: 11px;
border: 1px solid #aaa;
border-radius: 5px;
font-size: 16px;
}

button {
margin-top: 25px;
background: #111;
color: #fff;
border: none;
padding: 14px 25px;
border-radius: 5px;
font-size: 17px;
font-weight: bold;
cursor: pointer;
}

button:hover {
background: #333;
}

.results {
margin-top: 30px;
}

.table-wrap {
width: 100%;
overflow-x: auto;
margin-top: 15px;
}

table {
width: 100%;
min-width: 650px;
border-collapse: collapse;
}

th,
td {
border: 1px solid #ccc;
padding: 9px;
text-align: left;
}

th {
background: #111;
color: #fff;
}

tr:nth-child(even) td {
background: #f7f7f7;
}

.note {
background: #f1f1f1;
border-left: 4px solid #111;
padding: 12px 15px;
margin: 15px 0;
}

.diagram-wrap {
width: 100%;
overflow-x: auto;
border: 1px solid #ccc;
background: #fff;
padding: 10px;
}

svg {
display: block;
min-width: 650px;
width: 100%;
height: auto;
}

footer {
background: #000;
color: #fff;
text-align: center;
padding: 20px 15px;
margin-top: 40px;
}

.small {
font-size: 13px;
color: #555;
}

@media (max-width: 700px) {
.input-grid {
grid-template-columns: 1fr;
}

.calculator {
padding: 18px;
}

.container {
margin: 20px auto;
}
}
</style>
</head>

<body>

<header>
<h1>Timber Craft Works</h1>
<p>Shed Front Wall Calculator</p>
</header>

<div class="container">

<div class="calculator">

<h2>Front Wall Calculator</h2>

<div class="input-grid">

<div class="input-group">
<label for="wallLength">Overall Front Wall Length (mm)</label>
<input type="number" id="wallLength" value="3000" min="1">
</div>

<div class="input-group">
<label for="wallHeight">Overall Front Wall Height (mm)</label>
<input type="number" id="wallHeight" value="2100" min="1">
</div>

<div class="input-group">
<label for="timber">Timber Thickness (mm)</label>
<input type="number" id="timber" value="50" min="1">
</div>

<div class="input-group">
<label for="studCount">Main Wall Studs (including end studs)</label>
<input type="number" id="studCount" value="7" min="2">
</div>

<div class="input-group">
<label for="doorType">Door Type</label>
<select id="doorType">
<option value="single">Single Door</option>
<option value="double">Double Door</option>
</select>
</div>

<div class="input-group">
<label for="doorWidth">Clear Door Width (mm)</label>
<input type="number" id="doorWidth" value="900" min="1">
</div>

<div class="input-group">
<label for="doorHeight">Clear Door Height (mm)</label>
<input type="number" id="doorHeight" value="1900" min="1">
</div>

<div class="input-group">
<label for="doorSide">Door Position Measured From</label>
<select id="doorSide">
<option value="left">Left</option>
<option value="right">Right</option>
</select>
</div>

<div class="input-group">
<label for="doorOffset">Door Offset From Selected Side (mm)</label>
<input type="number" id="doorOffset" value="300" min="0">
</div>

<div class="input-group">
<label for="windowInclude">Window</label>
<select id="windowInclude">
<option value="no">No Window</option>
<option value="yes">Include Window</option>
</select>
</div>

<div class="input-group">
<label for="windowWidth">Clear Window Width (mm)</label>
<input type="number" id="windowWidth" value="600" min="1">
</div>

<div class="input-group">
<label for="windowHeight">Clear Window Height (mm)</label>
<input type="number" id="windowHeight" value="600" min="1">
</div>

<div class="input-group">
<label for="windowSill">Window Sill Height Above Bottom Rail (mm)</label>
<input type="number" id="windowSill" value="900" min="0">
</div>

<div class="input-group">
<label for="windowSide">Window Position Measured From</label>
<select id="windowSide">
<option value="left">Left</option>
<option value="right">Right</option>
</select>
</div>

<div class="input-group">
<label for="windowOffset">Window Offset From Selected Side (mm)</label>
<input type="number" id="windowOffset" value="1700" min="0">
</div>

</div>

<button onclick="calculate()">Calculate Front Wall</button>

<div id="results" class="results"></div>

</div>
</div>

<footer>
Timber Craft Works &copy; 2026
</footer>

<script>

function mm(value) {
return Math.round(value * 100) / 100;
}

function calculate() {

const wallLength = Number(document.getElementById("wallLength").value);
const wallHeight = Number(document.getElementById("wallHeight").value);
const timber = Number(document.getElementById("timber").value);
const studCount = Number(document.getElementById("studCount").value);

const doorWidth = Number(document.getElementById("doorWidth").value);
const doorHeight = Number(document.getElementById("doorHeight").value);
const doorSide = document.getElementById("doorSide").value;
const doorOffset = Number(document.getElementById("doorOffset").value);

const windowInclude = document.getElementById("windowInclude").value;
const windowWidth = Number(document.getElementById("windowWidth").value);
const windowHeight = Number(document.getElementById("windowHeight").value);
const windowSill = Number(document.getElementById("windowSill").value);
const windowSide = document.getElementById("windowSide").value;
const windowOffset = Number(document.getElementById("windowOffset").value);

if (
wallLength <= 0 ||
wallHeight <= 0 ||
timber <= 0 ||
studCount < 2
) {
alert("Please enter valid wall dimensions and stud numbers.");
return;
}

/*
* ------------------------------------------------------------
* DOOR POSITION
* ------------------------------------------------------------
*/

let doorStart;

if (doorSide === "left") {
doorStart = doorOffset;
} else {
doorStart = wallLength - doorOffset - doorWidth;
}

const doorEnd = doorStart + doorWidth;

/*
* ------------------------------------------------------------
* WINDOW POSITION
* ------------------------------------------------------------
*/

let windowStart = null;
let windowEnd = null;

if (windowInclude === "yes") {

if (windowSide === "left") {
windowStart = windowOffset;
} else {
windowStart = wallLength - windowOffset - windowWidth;
}

windowEnd = windowStart + windowWidth;
}

/*
* ------------------------------------------------------------
* MAIN STUD SPACING
*
* The main studs are distributed through the solid wall
* sections only. Door and window openings are excluded.
* ------------------------------------------------------------
*/

const mainStudsRequired = studCount - 2;

const solidIntervals = [];

let current = timber;

if (doorStart > current) {
solidIntervals.push({
start: current,
end: doorStart
});
}

current = doorEnd;

if (windowInclude === "yes") {

if (windowStart > current) {
solidIntervals.push({
start: current,
end: windowStart
});
}

current = windowEnd;
}

if (wallLength - timber > current) {
solidIntervals.push({
start: current,
end: wallLength - timber
});
}

/*
* Work out how many main studs go into each solid interval.
*/
let totalSolidLength = 0;

solidIntervals.forEach(interval => {
totalSolidLength += interval.end - interval.start;
});

let remainingStuds = mainStudsRequired;

const intervalStudCounts = [];

solidIntervals.forEach((interval, index) => {

if (index === solidIntervals.length - 1) {

intervalStudCounts.push(remainingStuds);

} else {

const proportion =
(interval.end - interval.start) / totalSolidLength;

let count = Math.round(mainStudsRequired * proportion);

if (count < 0) count = 0;

if (count > remainingStuds) {
count = remainingStuds;
}

intervalStudCounts.push(count);
remainingStuds -= count;
}
});

/*
* ------------------------------------------------------------
* MAIN STUDS
* ------------------------------------------------------------
*/

const mainStuds = [];

// Left end stud
mainStuds.push({
type: "Main Stud",
name: "Left End Stud",
start: 0,
end: wallHeight
});

solidIntervals.forEach((interval, index) => {

const studsHere = intervalStudCounts[index];

if (studsHere <= 0) return;

const availableLength =
interval.end - interval.start;

/*
* Equal clear gaps between timber pieces.
*
* Timber itself occupies "timber" mm.
*/
const gap =
(availableLength - timber * studsHere) /
(studsHere + 1);

for (let i = 0; i < studsHere; i++) {

const start =
interval.start +
gap +
i * (timber + gap);

mainStuds.push({
type: "Main Stud",
name: "Main Stud " + (mainStuds.length + 1),
start: start,
end: wallHeight
});
}
});

// Right end stud
mainStuds.push({
type: "Main Stud",
name: "Right End Stud",
start: wallLength - timber,
end: wallHeight
});

/*
* Sort main studs by their actual starting position.
*/
mainStuds.sort((a, b) => a.start - b.start);

/*
* ------------------------------------------------------------
* FIXED FRAME MEMBERS
* ------------------------------------------------------------
*/

const fixedStuds = [];

/*
* Door side studs
*/
fixedStuds.push({
type: "Door Frame",
name: "Door Left Frame Stud",
start: doorStart,
end: wallHeight
});

fixedStuds.push({
type: "Door Frame",
name: "Door Right Frame Stud",
start: doorEnd - timber,
end: wallHeight
});

/*
* Window side studs.
*
* These are full-height structural studs, matching the
* wall-frame construction and cutting list.
*/
if (windowInclude === "yes") {

fixedStuds.push({
type: "Window Frame",
name: "Window Left Frame Stud",
start: windowStart,
end: wallHeight
});

fixedStuds.push({
type: "Window Frame",
name: "Window Right Frame Stud",
start: windowEnd - timber,
end: wallHeight
});
}

/*
* ------------------------------------------------------------
* DOOR HEADER AND DOOR CRIPPLES
* ------------------------------------------------------------
*/

const doorHeaderBottom = doorHeight;
const doorHeaderTop = doorHeight + timber;

const doorCrippleLength =
wallHeight - doorHeaderTop - timber;

/*
* Two door cripples evenly positioned between the door frame
* studs.
*/
const doorCrippleUsableWidth =
doorWidth - 2 * timber;

const doorCripple1Centre =
doorStart +
timber +
doorCrippleUsableWidth / 3;

const doorCripple2Centre =
doorStart +
timber +
2 * doorCrippleUsableWidth / 3;

/*
* ------------------------------------------------------------
* WINDOW FRAMING
* ------------------------------------------------------------
*/

let windowBottom = null;
let windowBottomTop = null;
let windowTopBottom = null;
let windowTop = null;

let windowBottomCrippleLength = 0;
let windowTopCrippleLength = 0;

let windowBottomCripple1Centre = null;
let windowBottomCripple2Centre = null;

let windowTopCripple1Centre = null;
let windowTopCripple2Centre = null;

if (windowInclude === "yes") {

/*
* Sill height is measured from the TOP of the bottom rail
* to the bottom of the clear window opening.
*/
windowBottom = windowSill;

windowBottomTop =
windowSill + timber;

/*
* Clear window opening.
*/
windowTopBottom =
windowSill + windowHeight;

/*
* Horizontal top window member.
*/
windowTop =
windowTopBottom + timber;

/*
* Bottom window cripples run from the top of the
* continuous bottom rail to the underside of the
* bottom window horizontal.
*/
windowBottomCrippleLength =
windowSill - timber;

/*
* Top window cripples run from the top of the
* top window horizontal to the underside of the
* top rail.
*/
windowTopCrippleLength =
wallHeight - timber - windowTop;

const windowCrippleUsableWidth =
windowWidth - 2 * timber;

windowBottomCripple1Centre =
windowStart +
timber +
windowCrippleUsableWidth / 3;

windowBottomCripple2Centre =
windowStart +
timber +
2 * windowCrippleUsableWidth / 3;

windowTopCripple1Centre =
windowBottomCripple1Centre;

windowTopCripple2Centre =
windowBottomCripple2Centre;
}

/*
* ------------------------------------------------------------
* BUILD ALL VERTICAL MEMBERS FOR THE TABLE
* ------------------------------------------------------------
*/

const verticalMembers = [];

mainStuds.forEach(stud => {
verticalMembers.push({
type: "Main Stud",
name: stud.name,
start: stud.start,
end: stud.end
});
});

fixedStuds.forEach(stud => {
verticalMembers.push(stud);
});

/*
* Door cripples
*/
verticalMembers.push({
type: "Door Cripple",
name: "Door Cripple 1",
start: doorCripple1Centre - timber / 2,
end: wallHeight - timber
});

verticalMembers.push({
type: "Door Cripple",
name: "Door Cripple 2",
start: doorCripple2Centre - timber / 2,
end: wallHeight - timber
});

/*
* Window cripples
*/
if (windowInclude === "yes") {

verticalMembers.push({
type: "Window Bottom Cripple",
name: "Window Bottom Cripple 1",
start: windowBottomCripple1Centre - timber / 2,
end: windowBottom
});

verticalMembers.push({
type: "Window Bottom Cripple",
name: "Window Bottom Cripple 2",
start: windowBottomCripple2Centre - timber / 2,
end: windowBottom
});

verticalMembers.push({
type: "Window Top Cripple",
name: "Window Top Cripple 1",
start: windowTopCripple1Centre - timber / 2,
end: wallHeight - timber
});

verticalMembers.push({
type: "Window Top Cripple",
name: "Window Top Cripple 2",
start: windowTopCripple2Centre - timber / 2,
end: wallHeight - timber
});
}

/*
* ------------------------------------------------------------
* GAP BETWEEN MAIN STUDS
*
* This is calculated separately from the other vertical
* framing members so window/door cripples do not distort
* the main wall stud spacing.
* ------------------------------------------------------------
*/

const mainStudTable = [];

mainStuds.forEach((stud, index) => {

let gapToNext = "";

if (index < mainStuds.length - 1) {

const nextStud = mainStuds[index + 1];

gapToNext = mm(
nextStud.start -
(stud.start + timber)
);
}

mainStudTable.push({
...stud,
gapToNext: gapToNext
});
});

/*
* ------------------------------------------------------------
* CUTTING LIST
* ------------------------------------------------------------
*/

const cuttingList = [];

cuttingList.push({
item: "Main Wall Studs",
quantity: mainStuds.length,
length: wallHeight
});

cuttingList.push({
item: "Door Frame Studs",
quantity: 2,
length: wallHeight
});

cuttingList.push({
item: "Door Header",
quantity: 1,
length: doorWidth
});

cuttingList.push({
item: "Door Cripples",
quantity: 2,
length: Math.max(0, doorCrippleLength)
});

cuttingList.push({
item: "Bottom Rail",
quantity: 1,
length: wallLength
});

cuttingList.push({
item: "Top Rail",
quantity: 1,
length: wallLength
});

if (windowInclude === "yes") {

cuttingList.push({
item: "Window Vertical Frame Studs",
quantity: 2,
length: wallHeight
});

cuttingList.push({
item: "Window Bottom Horizontal",
quantity: 1,
length: windowWidth
});

cuttingList.push({
item: "Window Top Horizontal",
quantity: 1,
length: windowWidth
});

cuttingList.push({
item: "Window Bottom Cripples",
quantity: 2,
length: Math.max(0, windowBottomCrippleLength)
});

cuttingList.push({
item: "Window Top Cripples",
quantity: 2,
length: Math.max(0, windowTopCrippleLength)
});
}

/*
* ------------------------------------------------------------
* SVG DIAGRAM
* ------------------------------------------------------------
*
* IMPORTANT:
* Every vertical member is drawn from its calculated
* start/end coordinates.
*
* The main-stud gap dimensions are also generated from
* those same mainStud objects.
* ------------------------------------------------------------
*/

const svgWidth = 1100;
const leftMargin = 80;
const rightMargin = 40;
const drawingWidth = svgWidth - leftMargin - rightMargin;

const drawingHeight = 520;

const scaleX = drawingWidth / wallLength;
const scaleY = 390 / wallHeight;

const scale = Math.min(scaleX, scaleY);

const actualDrawingWidth = wallLength * scale;
const actualDrawingHeight = wallHeight * scale;

const x0 =
leftMargin +
(drawingWidth - actualDrawingWidth) / 2;

const topY = 70;

const bottomY =
topY + actualDrawingHeight;

const timberPx =
timber * scale;

function xFromMm(value) {
return x0 + value * scale;
}

function yFromMm(value) {
return bottomY - value * scale;
}

let svg = `
<svg
viewBox="0 0 ${svgWidth} ${drawingHeight}"
xmlns="http://www.w3.org/2000/svg">

<rect
x="0"
y="0"
width="${svgWidth}"
height="${drawingHeight}"
fill="#ffffff"/>

<!-- Title -->
<text
x="${svgWidth / 2}"
y="25"
text-anchor="middle"
font-family="Arial"
font-size="18"
font-weight="bold">
Front Wall Frame - ${wallLength} × ${wallHeight} mm
</text>

<!-- Wall background -->
<rect
x="${x0}"
y="${topY}"
width="${actualDrawingWidth}"
height="${actualDrawingHeight}"
fill="#f4f4f4"
stroke="#111"
stroke-width="2"/>

`;

/*
* Bottom rail
*/
svg += `
<rect
x="${x0}"
y="${bottomY - timberPx}"
width="${actualDrawingWidth}"
height="${timberPx}"
fill="#bd8950"
stroke="#80572d"
stroke-width="1.5"/>

<text
x="${x0 + actualDrawingWidth / 2}"
y="${bottomY - timberPx / 2 + 5}"
text-anchor="middle"
font-family="Arial"
font-size="11"
font-weight="bold">
CONTINUOUS BOTTOM RAIL
</text>
`;

/*
* Top rail
*/
svg += `
<rect
x="${x0}"
y="${topY}"
width="${actualDrawingWidth}"
height="${timberPx}"
fill="#bd8950"
stroke="#80572d"
stroke-width="1.5"/>

<text
x="${x0 + actualDrawingWidth / 2}"
y="${topY + timberPx / 2 + 5}"
text-anchor="middle"
font-family="Arial"
font-size="11"
font-weight="bold">
CONTINUOUS TOP RAIL
</text>
`;

/*
* ------------------------------------------------------------
* MAIN STUDS
* ------------------------------------------------------------
*/

mainStuds.forEach((stud, index) => {

const x = xFromMm(stud.start);

svg += `
<rect
x="${x}"
y="${topY + timberPx}"
width="${timberPx}"
height="${actualDrawingHeight - timberPx * 2}"
fill="#bd8950"
stroke="#80572d"
stroke-width="1.5"/>

<text
x="${x + timberPx / 2}"
y="${topY - 7}"
text-anchor="middle"
font-family="Arial"
font-size="9"
font-weight="bold">
${Math.round(stud.start)}
</text>
`;
});

/*
* ------------------------------------------------------------
* DOOR FRAME STUDS
* ------------------------------------------------------------
*/

[
{
x: doorStart,
label: "DOOR"
},
{
x: doorEnd - timber,
label: ""
}
].forEach((member, index) => {

const x = xFromMm(member.x);

svg += `
<rect
x="${x}"
y="${topY + timberPx}"
width="${timberPx}"
height="${actualDrawingHeight - timberPx * 2}"
fill="#999999"
stroke="#555555"
stroke-width="1.5"/>
`;

if (index === 0) {
svg += `
<text
x="${x + timberPx / 2}"
y="${topY + actualDrawingHeight / 2}"
text-anchor="middle"
font-family="Arial"
font-size="10"
font-weight="bold"
transform="rotate(-90 ${x + timberPx / 2} ${topY + actualDrawingHeight / 2})">
DOOR FRAME
</text>
`;
}
});

/*
* ------------------------------------------------------------
* DOOR OPENING
* ------------------------------------------------------------
*/

const doorOpeningX = xFromMm(doorStart + timber);
const doorOpeningWidth =
(doorWidth - timber * 2) * scale;

const doorOpeningY =
yFromMm(doorHeight);

svg += `
<rect
x="${doorOpeningX}"
y="${doorOpeningY}"
width="${doorOpeningWidth}"
height="${doorHeight * scale - timberPx}"
fill="#ffffff"
stroke="#111"
stroke-width="2"/>

<text
x="${doorOpeningX + doorOpeningWidth / 2}"
y="${doorOpeningY + (doorHeight * scale) / 2}"
text-anchor="middle"
font-family="Arial"
font-size="12"
font-weight="bold">
CLEAR DOOR
</text>

<text
x="${doorOpeningX + doorOpeningWidth / 2}"
y="${doorOpeningY + (doorHeight * scale) / 2 + 18}"
text-anchor="middle"
font-family="Arial"
font-size="10">
${doorWidth} × ${doorHeight} mm
</text>
`;

/*
* ------------------------------------------------------------
* DOOR HEADER
* ------------------------------------------------------------
*/

svg += `
<rect
x="${xFromMm(doorStart)}"
y="${yFromMm(doorHeaderTop)}"
width="${doorWidth * scale}"
height="${timberPx}"
fill="#555555"
stroke="#111"
stroke-width="1.5"/>

<text
x="${xFromMm(doorStart + doorWidth / 2)}"
y="${yFromMm(doorHeaderTop) + timberPx / 2 + 4}"
text-anchor="middle"
font-family="Arial"
font-size="10"
fill="#fff"
font-weight="bold">
DOOR HEADER
</text>
`;

/*
* ------------------------------------------------------------
* DOOR CRIPPLES
* ------------------------------------------------------------
*/

[
doorCripple1Centre,
doorCripple2Centre
].forEach((centre, index) => {

const x =
xFromMm(centre - timber / 2);

const y =
yFromMm(wallHeight - timber);

const h =
doorCrippleLength * scale;

svg += `
<rect
x="${x}"
y="${y}"
width="${timberPx}"
height="${h}"
fill="#999999"
stroke="#555555"
stroke-width="1.2"/>

<text
x="${x + timberPx / 2}"
y="${y - 4}"
text-anchor="middle"
font-family="Arial"
font-size="8">
${Math.round(centre)}
</text>
`;
});

/*
* ------------------------------------------------------------
* WINDOW FRAME
* ------------------------------------------------------------
*/

if (windowInclude === "yes") {

/*
* Window side frame studs
*/
[
windowStart,
windowEnd - timber
].forEach((xValue, index) => {

const x = xFromMm(xValue);

svg += `
<rect
x="${x}"
y="${topY + timberPx}"
width="${timberPx}"
height="${actualDrawingHeight - timberPx * 2}"
fill="#999999"
stroke="#555555"
stroke-width="1.5"/>
`;

});

/*
* Clear window opening
*/
const clearWindowX =
xFromMm(windowStart + timber);

const clearWindowWidth =
(windowWidth - timber * 2) * scale;

const clearWindowBottom =
yFromMm(windowSill + windowHeight);

const clearWindowHeight =
windowHeight * scale;

svg += `
<rect
x="${clearWindowX}"
y="${clearWindowBottom}"
width="${clearWindowWidth}"
height="${clearWindowHeight}"
fill="#ffffff"
stroke="#111"
stroke-width="2"/>

<text
x="${clearWindowX + clearWindowWidth / 2}"
y="${clearWindowBottom + clearWindowHeight / 2}"
text-anchor="middle"
font-family="Arial"
font-size="11"
font-weight="bold">
CLEAR WINDOW
</text>

<text
x="${clearWindowX + clearWindowWidth / 2}"
y="${clearWindowBottom + clearWindowHeight / 2 + 16}"
text-anchor="middle"
font-family="Arial"
font-size="9">
${windowWidth} × ${windowHeight} mm
</text>
`;

/*
* Bottom window horizontal
*/
svg += `
<rect
x="${xFromMm(windowStart)}"
y="${yFromMm(windowSill + timber)}"
width="${windowWidth * scale}"
height="${timberPx}"
fill="#555555"
stroke="#111"
stroke-width="1.5"/>

<text
x="${xFromMm(windowStart + windowWidth / 2)}"
y="${yFromMm(windowSill + timber) + timberPx / 2 + 4}"
text-anchor="middle"
font-family="Arial"
font-size="9"
fill="#fff"
font-weight="bold">
WINDOW BOTTOM
</text>
`;

/*
* Top window horizontal
*/
svg += `
<rect
x="${xFromMm(windowStart)}"
y="${yFromMm(windowTop)}"
width="${windowWidth * scale}"
height="${timberPx}"
fill="#555555"
stroke="#111"
stroke-width="1.5"/>

<text
x="${xFromMm(windowStart + windowWidth / 2)}"
y="${yFromMm(windowTop) + timberPx / 2 + 4}"
text-anchor="middle"
font-family="Arial"
font-size="9"
fill="#fff"
font-weight="bold">
WINDOW TOP
</text>
`;

/*
* Bottom window cripples
*/
[
windowBottomCripple1Centre,
windowBottomCripple2Centre
].forEach((centre, index) => {

const x =
xFromMm(centre - timber / 2);

const y =
yFromMm(windowSill);

const h =
windowBottomCrippleLength * scale;

svg += `
<rect
x="${x}"
y="${y}"
width="${timberPx}"
height="${h}"
fill="#bd8950"
stroke="#80572d"
stroke-width="1.2"/>

<text
x="${x + timberPx / 2}"
y="${y + h / 2}"
text-anchor="middle"
font-family="Arial"
font-size="7"
transform="rotate(-90 ${x + timberPx / 2} ${y + h / 2})">
CRIPPLE
</text>
`;
});

/*
* Top window cripples
*/
[
windowTopCripple1Centre,
windowTopCripple2Centre
].forEach((centre, index) => {

const x =
xFromMm(centre - timber / 2);

const topCrippleTop =
wallHeight - timber;

const y =
yFromMm(topCrippleTop);

const h =
windowTopCrippleLength * scale;

svg += `
<rect
x="${x}"
y="${y}"
width="${timberPx}"
height="${h}"
fill="#bd8950"
stroke="#80572d"
stroke-width="1.2"/>

<text
x="${x + timberPx / 2}"
y="${y + h / 2}"
text-anchor="middle"
font-family="Arial"
font-size="7"
transform="rotate(-90 ${x + timberPx / 2} ${y + h / 2})">
CRIPPLE
</text>
`;
});
}

/*
* ------------------------------------------------------------
* MAIN STUD GAP DIMENSIONS
* ------------------------------------------------------------
*
* These dimensions are deliberately calculated from the
* main studs only. Door/window framing does not alter them.
*/

mainStuds.forEach((stud, index) => {

if (index >= mainStuds.length - 1) return;

const next = mainStuds[index + 1];

const gap =
next.start -
(stud.start + timber);

if (gap <= 0) return;

const x1 =
xFromMm(stud.start + timber);

const x2 =
xFromMm(next.start);

const dimensionY =
bottomY + 25;

svg += `
<line
x1="${x1}"
y1="${dimensionY}"
x2="${x2}"
y2="${dimensionY}"
stroke="#111"
stroke-width="1"/>

<line
x1="${x1}"
y1="${dimensionY - 5}"
x2="${x1}"
y2="${dimensionY + 5}"
stroke="#111"
stroke-width="1"/>

<line
x1="${x2}"
y1="${dimensionY - 5}"
x2="${x2}"
y2="${dimensionY + 5}"
stroke="#111"
stroke-width="1"/>

<text
x="${(x1 + x2) / 2}"
y="${dimensionY + 16}"
text-anchor="middle"
font-family="Arial"
font-size="9"
font-weight="bold">
${Math.round(gap)} mm
</text>
`;
});

/*
* Overall wall dimensions
*/

svg += `
<line
x1="${x0}"
y1="${bottomY + 55}"
x2="${x0 + actualDrawingWidth}"
y2="${bottomY + 55}"
stroke="#111"
stroke-width="1.5"/>

<line
x1="${x0}"
y1="${bottomY + 48}"
x2="${x0}"
y2="${bottomY + 62}"
stroke="#111"
stroke-width="1.5"/>

<line
x1="${x0 + actualDrawingWidth}"
y1="${bottomY + 48}"
x2="${x0 + actualDrawingWidth}"
y2="${bottomY + 62}"
stroke="#111"
stroke-width="1.5"/>

<text
x="${x0 + actualDrawingWidth / 2}"
y="${bottomY + 75}"
text-anchor="middle"
font-family="Arial"
font-size="12"
font-weight="bold">
OVERALL LENGTH: ${wallLength} mm
</text>

<line
x1="${x0 - 45}"
y1="${topY}"
x2="${x0 - 45}"
y2="${bottomY}"
stroke="#111"
stroke-width="1.5"/>

<line
x1="${x0 - 52}"
y1="${topY}"
x2="${x0 - 38}"
y2="${topY}"
stroke="#111"
stroke-width="1.5"/>

<line
x1="${x0 - 52}"
y1="${bottomY}"
x2="${x0 - 38}"
y2="${bottomY}"
stroke="#111"
stroke-width="1.5"/>

<text
x="${x0 - 58}"
y="${(topY + bottomY) / 2}"
text-anchor="middle"
font-family="Arial"
font-size="12"
font-weight="bold"
transform="rotate(-90 ${x0 - 58} ${(topY + bottomY) / 2})">
OVERALL HEIGHT: ${wallHeight} mm
</text>

</svg>
`;

/*
* ------------------------------------------------------------
* STARTING POSITIONS TABLE
* ------------------------------------------------------------
*/

let tableHTML = `
<h3>Starting Positions of Main Wall Studs</h3>

<div class="note">
<strong>Important:</strong> Positions are measured from the
left-hand outside edge of the wall. The gap shown is the
clear gap between the edge of one main stud and the start
of the next main stud.
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Stud</th>
<th>Starting Position (mm)</th>
<th>Timber Width (mm)</th>
<th>End Position (mm)</th>
<th>Gap To Next Stud (mm)</th>
</tr>
</thead>
<tbody>
`;

mainStudTable.forEach(stud => {

tableHTML += `
<tr>
<td>${stud.name}</td>
<td>${mm(stud.start)}</td>
<td>${timber}</td>
<td>${mm(stud.start + timber)}</td>
<td>${stud.gapToNext === "" ? "—" : stud.gapToNext}</td>
</tr>
`;
});

tableHTML += `
</tbody>
</table>
</div>
`;

/*
* ------------------------------------------------------------
* FRAMING POSITIONS TABLE
* ------------------------------------------------------------
*/

tableHTML += `
<h3>Door & Window Framing Positions</h3>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Member</th>
<th>Starting Position (mm)</th>
<th>Length (mm)</th>
<th>Position / Description</th>
</tr>
</thead>
<tbody>

<tr>
<td>Door Left Frame</td>
<td>${mm(doorStart)}</td>
<td>${wallHeight}</td>
<td>Full-height door frame</td>
</tr>

<tr>
<td>Door Right Frame</td>
<td>${mm(doorEnd - timber)}</td>
<td>${wallHeight}</td>
<td>Full-height door frame</td>
</tr>

<tr>
<td>Door Header</td>
<td>${mm(doorStart)}</td>
<td>${doorWidth}</td>
<td>Above door opening</td>
</tr>

<tr>
<td>Door Cripple 1</td>
<td>${mm(doorCripple1Centre - timber / 2)}</td>
<td>${Math.max(0, mm(doorCrippleLength))}</td>
<td>Above door header</td>
</tr>

<tr>
<td>Door Cripple 2</td>
<td>${mm(doorCripple2Centre - timber / 2)}</td>
<td>${Math.max(0, mm(doorCrippleLength))}</td>
<td>Above door header</td>
</tr>
`;

if (windowInclude === "yes") {

tableHTML += `
<tr>
<td>Window Left Frame</td>
<td>${mm(windowStart)}</td>
<td>${wallHeight}</td>
<td>Full-height window frame</td>
</tr>

<tr>
<td>Window Right Frame</td>
<td>${mm(windowEnd - timber)}</td>
<td>${wallHeight}</td>
<td>Full-height window frame</td>
</tr>

<tr>
<td>Window Bottom Horizontal</td>
<td>${mm(windowStart)}</td>
<td>${windowWidth}</td>
<td>Below clear window opening</td>
</tr>

<tr>
<td>Window Top Horizontal</td>
<td>${mm(windowStart)}</td>
<td>${windowWidth}</td>
<td>Above clear window opening</td>
</tr>

<tr>
<td>Window Bottom Cripple 1</td>
<td>${mm(windowBottomCripple1Centre - timber / 2)}</td>
<td>${Math.max(0, mm(windowBottomCrippleLength))}</td>
<td>Below window opening</td>
</tr>

<tr>
<td>Window Bottom Cripple 2</td>
<td>${mm(windowBottomCripple2Centre - timber / 2)}</td>
<td>${Math.max(0, mm(windowBottomCrippleLength))}</td>
<td>Below window opening</td>
</tr>

<tr>
<td>Window Top Cripple 1</td>
<td>${mm(windowTopCripple1Centre - timber / 2)}</td>
<td>${Math.max(0, mm(windowTopCrippleLength))}</td>
<td>Above window opening</td>
</tr>

<tr>
<td>Window Top Cripple 2</td>
<td>${mm(windowTopCripple2Centre - timber / 2)}</td>
<td>${Math.max(0, mm(windowTopCrippleLength))}</td>
<td>Above window opening</td>
</tr>
`;
}

tableHTML += `
</tbody>
</table>
</div>
`;

/*
* ------------------------------------------------------------
* CUTTING LIST
* ------------------------------------------------------------
*/

tableHTML += `
<h3>Cutting List</h3>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Item</th>
<th>Quantity</th>
<th>Cut Length (mm)</th>
</tr>
</thead>
<tbody>
`;

cuttingList.forEach(item => {

tableHTML += `
<tr>
<td>${item.item}</td>
<td>${item.quantity}</td>
<td>${Math.round(item.length)}</td>
</tr>
`;
});

tableHTML += `
</tbody>
</table>
</div>
`;

/*
* ------------------------------------------------------------
* DIAGRAM
* ------------------------------------------------------------
*/

tableHTML += `
<h3>Front Wall Framing Diagram</h3>

<div class="note">
<strong>Diagram key:</strong>
Brown = main timber framing and window cripples.
Grey = door/window frame members.
The dimensions between the main studs are the calculated
clear gaps.
</div>

<div class="diagram-wrap">
${svg}
</div>
`;

/*
* ------------------------------------------------------------
* CALCULATION SUMMARY
* ------------------------------------------------------------
*/

tableHTML += `
<h3>Calculation Summary</h3>

<div class="table-wrap">
<table>
<tbody>

<tr>
<th>Overall Wall</th>
<td>${wallLength} × ${wallHeight} mm</td>
</tr>

<tr>
<th>Timber Thickness</th>
<td>${timber} mm</td>
</tr>

<tr>
<th>Main Wall Studs</th>
<td>${mainStuds.length}</td>
</tr>

<tr>
<th>Door Opening</th>
<td>${doorWidth} × ${doorHeight} mm</td>
</tr>
`;

if (windowInclude === "yes") {

tableHTML += `
<tr>
<th>Window Opening</th>
<td>${windowWidth} × ${windowHeight} mm</td>
</tr>

<tr>
<th>Window Sill Height</th>
<td>${windowSill} mm above bottom rail</td>
</tr>
`;
}

tableHTML += `
</tbody>
</table>
</div>
`;

document.getElementById("results").innerHTML = tableHTML;
}

/*
* Calculate automatically when the page loads.
*/
calculate();

</script>

</body>
</html>
