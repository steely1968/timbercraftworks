<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timber Craft Works - Shed Front Wall Calculator</title>

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: Arial, Helvetica, sans-serif;
background: #f2f2f2;
color: #111;
line-height: 1.5;
}

header {
background: #000;
color: #fff;
text-align: center;
padding: 30px 15px;
}

header h1 {
font-size: clamp(28px, 5vw, 46px);
font-weight: bold;
letter-spacing: 2px;
}

header p {
margin-top: 8px;
font-size: 16px;
}

.container {
width: 100%;
max-width: 1150px;
margin: 30px auto;
padding: 0 15px;
}

.calculator {
background: #fff;
padding: 25px;
border-radius: 10px;
box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

h2 {
font-size: 26px;
margin-bottom: 20px;
}

h3 {
font-size: 21px;
margin: 30px 0 15px;
}

.input-grid {
display: grid;
grid-template-columns: repeat(2, minmax(0, 1fr));
gap: 15px 25px;
}

.input-group {
display: flex;
flex-direction: column;
}

label {
font-weight: bold;
margin-bottom: 6px;
}

input,
select {
width: 100%;
padding: 11px;
border: 1px solid #aaa;
border-radius: 5px;
font-size: 16px;
}

button {
margin-top: 25px;
background: #111;
color: #fff;
border: none;
padding: 14px 25px;
border-radius: 5px;
font-size: 17px;
font-weight: bold;
cursor: pointer;
}

button:hover {
background: #333;
}

.results {
margin-top: 30px;
}

.table-wrap {
width: 100%;
overflow-x: auto;
margin-top: 15px;
}

table {
width: 100%;
min-width: 650px;
border-collapse: collapse;
}

th,
td {
border: 1px solid #ccc;
padding: 9px;
text-align: left;
}

th {
background: #111;
color: #fff;
}

tr:nth-child(even) td {
background: #f7f7f7;
}

.note {
background: #f1f1f1;
border-left: 4px solid #111;
padding: 12px 15px;
margin: 15px 0;
}

.diagram-wrap {
width: 100%;
overflow-x: auto;
border: 1px solid #ccc;
background: #fff;
padding: 10px;
}

svg {
display: block;
min-width: 650px;
width: 100%;
height: auto;
}

footer {
background: #000;
color: #fff;
text-align: center;
padding: 20px 15px;
margin-top: 40px;
}

@media (max-width: 700px) {
.input-grid {
grid-template-columns: 1fr;
}

.calculator {
padding: 18px;
}

.container {
margin: 20px auto;
}
}
</style>
</head>

<body>

<header>
<h1>Timber Craft Works</h1>
<p>Shed Front Wall Calculator</p>
</header>

<div class="container">
<div class="calculator">

<h2>Front Wall Calculator</h2>

<div class="input-grid">

<div class="input-group">
<label for="wallLength">Overall Front Wall Length (mm)</label>
<input type="number" id="wallLength" value="3000" min="1">
</div>

<div class="input-group">
<label for="wallHeight">Overall Front Wall Height (mm)</label>
<input type="number" id="wallHeight" value="2100" min="1">
</div>

<div class="input-group">
<label for="timber">Timber Thickness (mm)</label>
<input type="number" id="timber" value="50" min="1">
</div>

<div class="input-group">
<label for="studCount">Main Wall Studs (including end studs)</label>
<input type="number" id="studCount" value="7" min="2">
</div>

<div class="input-group">
<label for="doorType">Door Type</label>
<select id="doorType">
<option value="single">Single Door</option>
<option value="double">Double Door</option>
</select>
</div>

<div class="input-group">
<label for="doorWidth">Clear Door Width (mm)</label>
<input type="number" id="doorWidth" value="900" min="1">
</div>

<div class="input-group">
<label for="doorHeight">Clear Door Height (mm)</label>
<input type="number" id="doorHeight" value="1900" min="1">
</div>

<div class="input-group">
<label for="doorSide">Door Position Measured From</label>
<select id="doorSide">
<option value="left">Left</option>
<option value="right">Right</option>
</select>
</div>

<div class="input-group">
<label for="doorOffset">Door Offset From Selected Side (mm)</label>
<input type="number" id="doorOffset" value="300" min="0">
</div>

<div class="input-group">
<label for="windowInclude">Window</label>
<select id="windowInclude">
<option value="no">No Window</option>
<option value="yes">Include Window</option>
</select>
</div>

<div class="input-group">
<label for="windowWidth">Clear Window Width (mm)</label>
<input type="number" id="windowWidth" value="600" min="1">
</div>

<div class="input-group">
<label for="windowHeight">Clear Window Height (mm)</label>
<input type="number" id="windowHeight" value="600" min="1">
</div>

<div class="input-group">
<label for="windowSill">Window Sill Height Above Bottom Rail (mm)</label>
<input type="number" id="windowSill" value="900" min="0">
</div>

<div class="input-group">
<label for="windowSide">Window Position Measured From</label>
<select id="windowSide">
<option value="left">Left</option>
<option value="right">Right</option>
</select>
</div>

<div class="input-group">
<label for="windowOffset">Window Offset From Selected Side (mm)</label>
<input type="number" id="windowOffset" value="1700" min="0">
</div>

</div>

<button onclick="calculate()">Calculate Front Wall</button>

<div id="results" class="results"></div>

</div>
</div>

<footer>
Timber Craft Works &copy; 2026
</footer>

<script>

function mm(value) {
return Math.round(value * 100) / 100;
}

function calculate() {

const wallLength = Number(document.getElementById("wallLength").value);
const wallHeight = Number(document.getElementById("wallHeight").value);
const timber = Number(document.getElementById("timber").value);
const studCount = Number(document.getElementById("studCount").value);

const doorWidth = Number(document.getElementById("doorWidth").value);
const doorHeight = Number(document.getElementById("doorHeight").value);
const doorSide = document.getElementById("doorSide").value;
const doorOffset = Number(document.getElementById("doorOffset").value);

const windowInclude = document.getElementById("windowInclude").value;
const windowWidth = Number(document.getElementById("windowWidth").value);
const windowHeight = Number(document.getElementById("windowHeight").value);
const windowSill = Number(document.getElementById("windowSill").value);
const windowSide = document.getElementById("windowSide").value;
const windowOffset = Number(document.getElementById("windowOffset").value);

if (
wallLength <= 0 ||
wallHeight <= 0 ||
timber <= 0 ||
studCount < 2
) {
alert("Please enter valid wall dimensions and stud numbers.");
return;
}


/* ============================================================
DOOR POSITION
============================================================ */

let doorStart;

if (doorSide === "left") {
doorStart = doorOffset;
} else {
doorStart = wallLength - doorOffset - doorWidth;
}

const doorEnd = doorStart + doorWidth;


/* ============================================================
WINDOW POSITION
============================================================ */

let windowStart = null;
let windowEnd = null;

if (windowInclude === "yes") {

if (windowSide === "left") {
windowStart = windowOffset;
} else {
windowStart =
wallLength - windowOffset - windowWidth;
}

windowEnd = windowStart + windowWidth;
}


/* ============================================================
MAIN STUD POSITIONS
============================================================ */

const mainStudsRequired = studCount - 2;

const solidIntervals = [];

let current = timber;

if (doorStart > current) {
solidIntervals.push({
start: current,
end: doorStart
});
}

current = doorEnd;

if (windowInclude === "yes") {

if (windowStart > current) {
solidIntervals.push({
start: current,
end: windowStart
});
}

current = windowEnd;
}

if (wallLength - timber > current) {
solidIntervals.push({
start: current,
end: wallLength - timber
});
}


let totalSolidLength = 0;

solidIntervals.forEach(interval => {
totalSolidLength +=
interval.end - interval.start;
});


let remainingStuds = mainStudsRequired;
const intervalStudCounts = [];

solidIntervals.forEach((interval, index) => {

if (index === solidIntervals.length - 1) {

intervalStudCounts.push(
remainingStuds
);

} else {

const proportion =
(interval.end - interval.start) /
totalSolidLength;

let count =
Math.round(
mainStudsRequired * proportion
);

count = Math.max(0, count);
count = Math.min(count, remainingStuds);

intervalStudCounts.push(count);
remainingStuds -= count;
}
});


const mainStuds = [];


/* LEFT END STUD */

mainStuds.push({
type: "Main Stud",
name: "Left End Stud",
start: 0,
end: wallHeight
});


/* INTERNAL MAIN STUDS */

solidIntervals.forEach((interval, index) => {

const studsHere =
intervalStudCounts[index];

if (studsHere <= 0) return;

const availableLength =
interval.end - interval.start;

const gap =
(
availableLength -
timber * studsHere
) /
(studsHere + 1);

for (let i = 0; i < studsHere; i++) {

const start =
interval.start +
gap +
i * (timber + gap);

mainStuds.push({
type: "Main Stud",
name:
"Main Stud " +
(mainStuds.length + 1),
start: start,
end: wallHeight
});
}
});


/* RIGHT END STUD */

mainStuds.push({
type: "Main Stud",
name: "Right End Stud",
start: wallLength - timber,
end: wallHeight
});


mainStuds.sort(
(a, b) => a.start - b.start
);


/* ============================================================
DOOR FRAME STUDS
============================================================ */

const doorLeftFrame = doorStart;
const doorRightFrame = doorEnd - timber;


/*
IMPORTANT:

The CLEAR door opening is between the inside faces
of these two studs.

Therefore the header must also run between the
inside faces.
*/

const doorHeaderStart =
doorStart + timber;

const doorHeaderEnd =
doorEnd - timber;

const doorHeaderLength =
doorHeaderEnd - doorHeaderStart;


/* ============================================================
WINDOW FRAME STUDS
============================================================ */

let windowLeftFrame = null;
let windowRightFrame = null;

let windowHeaderStart = null;
let windowHeaderEnd = null;
let windowHeaderLength = null;

if (windowInclude === "yes") {

windowLeftFrame =
windowStart;

windowRightFrame =
windowEnd - timber;


/*
Header runs BETWEEN the inside faces of
the two window frame studs.
*/

windowHeaderStart =
windowStart + timber;

windowHeaderEnd =
windowEnd - timber;

windowHeaderLength =
windowHeaderEnd -
windowHeaderStart;
}


/* ============================================================
DOOR CRIPPLES
============================================================ */

const doorHeaderBottom =
doorHeight;

const doorHeaderTop =
doorHeight + timber;

const doorCrippleLength =
wallHeight -
doorHeaderTop -
timber;

const doorCrippleUsableWidth =
doorHeaderLength;

const doorCripple1Centre =
doorHeaderStart +
doorCrippleUsableWidth / 3;

const doorCripple2Centre =
doorHeaderStart +
(doorCrippleUsableWidth * 2 / 3);


/* ============================================================
WINDOW FRAMING
============================================================ */

let windowBottomCrippleLength = 0;
let windowTopCrippleLength = 0;

let windowBottomCripple1Centre = null;
let windowBottomCripple2Centre = null;

let windowTopCripple1Centre = null;
let windowTopCripple2Centre = null;

let windowBottom = null;
let windowBottomTop = null;
let windowTopBottom = null;
let windowTop = null;

if (windowInclude === "yes") {

windowBottom =
windowSill;

windowBottomTop =
windowSill + timber;

windowTopBottom =
windowSill +
windowHeight;

windowTop =
windowTopBottom + timber;


/*
Bottom cripples are positioned inside
the window frame studs.
*/

const usableWindowWidth =
windowHeaderLength;

windowBottomCripple1Centre =
windowHeaderStart +
usableWindowWidth / 3;

windowBottomCripple2Centre =
windowHeaderStart +
usableWindowWidth * 2 / 3;


windowTopCripple1Centre =
windowBottomCripple1Centre;

windowTopCripple2Centre =
windowBottomCripple2Centre;


windowBottomCrippleLength =
windowSill - timber;

windowTopCrippleLength =
wallHeight -
timber -
windowTop;
}


/* ============================================================
VERTICAL MEMBERS TABLE
============================================================ */

const verticalMembers = [];

mainStuds.forEach(stud => {

verticalMembers.push({
type: "Main Stud",
name: stud.name,
start: stud.start,
end: stud.end
});

});


verticalMembers.push({
type: "Door Frame",
name: "Door Left Frame Stud",
start: doorLeftFrame,
end: wallHeight
});

verticalMembers.push({
type: "Door Frame",
name: "Door Right Frame Stud",
start: doorRightFrame,
end: wallHeight
});


verticalMembers.push({
type: "Door Cripple",
name: "Door Cripple 1",
start:
doorCripple1Centre -
timber / 2,
end:
wallHeight - timber
});

verticalMembers.push({
type: "Door Cripple",
name: "Door Cripple 2",
start:
doorCripple2Centre -
timber / 2,
end:
wallHeight - timber
});


if (windowInclude === "yes") {

verticalMembers.push({
type: "Window Frame",
name: "Window Left Frame Stud",
start: windowLeftFrame,
end: wallHeight
});

verticalMembers.push({
type: "Window Frame",
name: "Window Right Frame Stud",
start: windowRightFrame,
end: wallHeight
});


verticalMembers.push({
type: "Window Bottom Cripple",
name: "Window Bottom Cripple 1",
start:
windowBottomCripple1Centre -
timber / 2,
end: windowBottom
});

verticalMembers.push({
type: "Window Bottom Cripple",
name: "Window Bottom Cripple 2",
start:
windowBottomCripple2Centre -
timber / 2,
end: windowBottom
});


verticalMembers.push({
type: "Window Top Cripple",
name: "Window Top Cripple 1",
start:
windowTopCripple1Centre -
timber / 2,
end:
wallHeight - timber
});

verticalMembers.push({
type: "Window Top Cripple",
name: "Window Top Cripple 2",
start:
windowTopCripple2Centre -
timber / 2,
end:
wallHeight - timber
});
}


/* ============================================================
MAIN STUD GAP TABLE
============================================================ */

const mainStudTable = [];

mainStuds.forEach((stud, index) => {

let gapToNext = "";

if (index < mainStuds.length - 1) {

const next =
mainStuds[index + 1];

gapToNext =
mm(
next.start -
(stud.start + timber)
);
}

mainStudTable.push({
...stud,
gapToNext
});
});


/* ============================================================
CUTTING LIST
============================================================ */

const cuttingList = [];

cuttingList.push({
item: "Main Wall Studs",
quantity: mainStuds.length,
length: wallHeight
});

cuttingList.push({
item: "Door Frame Studs",
quantity: 2,
length: wallHeight
});

cuttingList.push({
item: "Door Header",
quantity: 1,
length: doorHeaderLength
});

cuttingList.push({
item: "Door Cripples",
quantity: 2,
length: Math.max(
0,
doorCrippleLength
)
});

cuttingList.push({
item: "Bottom Rail",
quantity: 1,
length: wallLength
});

cuttingList.push({
item: "Top Rail",
quantity: 1,
length: wallLength
});


if (windowInclude === "yes") {

cuttingList.push({
item: "Window Vertical Frame Studs",
quantity: 2,
length: wallHeight
});

cuttingList.push({
item: "Window Bottom Header",
quantity: 1,
length: windowHeaderLength
});

cuttingList.push({
item: "Window Top Header",
quantity: 1,
length: windowHeaderLength
});

cuttingList.push({
item: "Window Bottom Cripples",
quantity: 2,
length:
Math.max(
0,
windowBottomCrippleLength
)
});

cuttingList.push({
item: "Window Top Cripples",
quantity: 2,
length:
Math.max(
0,
windowTopCrippleLength
)
});
}


/* ============================================================
SVG
============================================================ */

const svgWidth = 1100;
const drawingHeight = 560;

const leftMargin = 100;
const rightMargin = 40;

const drawingWidth =
svgWidth -
leftMargin -
rightMargin;

const scaleX =
drawingWidth / wallLength;

const scaleY =
390 / wallHeight;

const scale =
Math.min(
scaleX,
scaleY
);

const actualDrawingWidth =
wallLength * scale;

const actualDrawingHeight =
wallHeight * scale;

const x0 =
leftMargin +
(
drawingWidth -
actualDrawingWidth
) / 2;

const topY = 70;

const bottomY =
topY +
actualDrawingHeight;

const timberPx =
timber * scale;


function xFromMm(value) {
return x0 + value * scale;
}

function yFromMm(value) {
return bottomY - value * scale;
}


let svg = `

<svg
viewBox="0 0 ${svgWidth} ${drawingHeight}"
xmlns="http://www.w3.org/2000/svg">

<rect
x="0"
y="0"
width="${svgWidth}"
height="${drawingHeight}"
fill="#fff"/>

<text
x="${svgWidth / 2}"
y="25"
text-anchor="middle"
font-family="Arial"
font-size="18"
font-weight="bold">
Front Wall Frame -
${wallLength} × ${wallHeight} mm
</text>


<!-- WALL BACKGROUND -->

<rect
x="${x0}"
y="${topY}"
width="${actualDrawingWidth}"
height="${actualDrawingHeight}"
fill="#f4f4f4"
stroke="#111"
stroke-width="2"/>


<!-- BOTTOM RAIL -->

<rect
x="${x0}"
y="${bottomY - timberPx}"
width="${actualDrawingWidth}"
height="${timberPx}"
fill="#bd8950"
stroke="#80572d"
stroke-width="1.5"/>


<!-- TOP RAIL -->

<rect
x="${x0}"
y="${topY}"
width="${actualDrawingWidth}"
height="${timberPx}"
fill="#bd8950"
stroke="#80572d"
stroke-width="1.5"/>

`;


/* ============================================================
MAIN STUDS
============================================================ */

mainStuds.forEach(stud => {

const x =
xFromMm(stud.start);

svg += `

<rect
x="${x}"
y="${topY + timberPx}"
width="${timberPx}"
height="${actualDrawingHeight - timberPx * 2}"
fill="#bd8950"
stroke="#80572d"
stroke-width="1.5"/>

<text
x="${x + timberPx / 2}"
y="${topY - 7}"
text-anchor="middle"
font-family="Arial"
font-size="9"
font-weight="bold">
${Math.round(stud.start)}
</text>

`;
});


/* ============================================================
DOOR FRAME STUDS
============================================================ */

svg += `

<!-- DOOR LEFT FRAME -->

<rect
x="${xFromMm(doorLeftFrame)}"
y="${topY + timberPx}"
width="${timberPx}"
height="${actualDrawingHeight - timberPx * 2}"
fill="#999"
stroke="#555"
stroke-width="1.5"/>


<!-- DOOR RIGHT FRAME -->

<rect
x="${xFromMm(doorRightFrame)}"
y="${topY + timberPx}"
width="${timberPx}"
height="${actualDrawingHeight - timberPx * 2}"
fill="#999"
stroke="#555"
stroke-width="1.5"/>

`;


/* ============================================================
DOOR CLEAR OPENING
============================================================ */

const doorClearX =
xFromMm(doorHeaderStart);

const doorClearWidth =
doorHeaderLength * scale;

const doorClearBottom =
yFromMm(doorHeight);

const doorClearHeight =
doorHeight * scale -
timberPx;


svg += `

<rect
x="${doorClearX}"
y="${doorClearBottom}"
width="${doorClearWidth}"
height="${doorClearHeight}"
fill="#fff"
stroke="#111"
stroke-width="2"/>

<text
x="${doorClearX + doorClearWidth / 2}"
y="${doorClearBottom + doorClearHeight / 2}"
text-anchor="middle"
font-family="Arial"
font-size="12"
font-weight="bold">
CLEAR DOOR
</text>

<text
x="${doorClearX + doorClearWidth / 2}"
y="${doorClearBottom + doorClearHeight / 2 + 17}"
text-anchor="middle"
font-family="Arial"
font-size="10">
${doorWidth} × ${doorHeight} mm
</text>

`;


/* ============================================================
DOOR HEADER
BETWEEN THE TWO FRAME STUDS
============================================================ */

svg += `

<rect
x="${xFromMm(doorHeaderStart)}"
y="${yFromMm(doorHeaderTop)}"
width="${doorHeaderLength * scale}"
height="${timberPx}"
fill="#555"
stroke="#111"
stroke-width="1.5"/>

<text
x="${xFromMm(
doorHeaderStart +
doorHeaderLength / 2
)}"
y="${yFromMm(doorHeaderTop) +
timberPx / 2 + 4}"
text-anchor="middle"
font-family="Arial"
font-size="9"
fill="#fff"
font-weight="bold">
DOOR HEADER
</text>

`;


/* ============================================================
DOOR CRIPPLES
============================================================ */

[
doorCripple1Centre,
doorCripple2Centre
].forEach(centre => {

const x =
xFromMm(
centre - timber / 2
);

const y =
yFromMm(
wallHeight - timber
);

const h =
doorCrippleLength * scale;

svg += `

<rect
x="${x}"
y="${y}"
width="${timberPx}"
height="${h}"
fill="#bd8950"
stroke="#80572d"
stroke-width="1.2"/>

`;
});


/* ============================================================
WINDOW
============================================================ */

if (windowInclude === "yes") {


/* WINDOW FRAME STUDS */

svg += `

<rect
x="${xFromMm(windowLeftFrame)}"
y="${topY + timberPx}"
width="${timberPx}"
height="${actualDrawingHeight - timberPx * 2}"
fill="#999"
stroke="#555"
stroke-width="1.5"/>

<rect
x="${xFromMm(windowRightFrame)}"
y="${topY + timberPx}"
width="${timberPx}"
height="${actualDrawingHeight - timberPx * 2}"
fill="#999"
stroke="#555"
stroke-width="1.5"/>

`;


/* WINDOW CLEAR OPENING */

const windowClearX =
xFromMm(windowHeaderStart);

const windowClearWidth =
windowHeaderLength * scale;

const windowClearBottom =
yFromMm(windowSill + windowHeight);

const windowClearHeight =
windowHeight * scale;


svg += `

<rect
x="${windowClearX}"
y="${windowClearBottom}"
width="${windowClearWidth}"
height="${windowClearHeight}"
fill="#fff"
stroke="#111"
stroke-width="2"/>

<text
x="${windowClearX + windowClearWidth / 2}"
y="${windowClearBottom + windowClearHeight / 2}"
text-anchor="middle"
font-family="Arial"
font-size="11"
font-weight="bold">
CLEAR WINDOW
</text>

<text
x="${windowClearX + windowClearWidth / 2}"
y="${windowClearBottom + windowClearHeight / 2 + 16}"
text-anchor="middle"
font-family="Arial"
font-size="9">
${windowWidth} × ${windowHeight} mm
</text>

`;


/* ============================================================
WINDOW BOTTOM HEADER
BETWEEN FRAME STUDS
============================================================ */

svg += `

<rect
x="${xFromMm(windowHeaderStart)}"
y="${yFromMm(windowSill + timber)}"
width="${windowHeaderLength * scale}"
height="${timberPx}"
fill="#555"
stroke="#111"
stroke-width="1.5"/>

<text
x="${xFromMm(
windowHeaderStart +
windowHeaderLength / 2
)}"
y="${yFromMm(windowSill + timber) +
timberPx / 2 + 4}"
text-anchor="middle"
font-family="Arial"
font-size="8"
fill="#fff"
font-weight="bold">
WINDOW BOTTOM
</text>

`;


/* ============================================================
WINDOW TOP HEADER
BETWEEN FRAME STUDS
============================================================ */

svg += `

<rect
x="${xFromMm(windowHeaderStart)}"
y="${yFromMm(windowTop)}"
width="${windowHeaderLength * scale}"
height="${timberPx}"
fill="#555"
stroke="#111"
stroke-width="1.5"/>

<text
x="${xFromMm(
windowHeaderStart +
windowHeaderLength / 2
)}"
y="${yFromMm(windowTop) +
timberPx / 2 + 4}"
text-anchor="middle"
font-family="Arial"
font-size="8"
fill="#fff"
font-weight="bold">
WINDOW TOP
</text>

`;


/* ============================================================
WINDOW BOTTOM CRIPPLES
============================================================ */

[
windowBottomCripple1Centre,
windowBottomCripple2Centre
].forEach(centre => {

const x =
xFromMm(
centre - timber / 2
);

const y =
yFromMm(windowSill);

const h =
windowBottomCrippleLength *
scale;

svg += `

<rect
x="${x}"
y="${y}"
width="${timberPx}"
height="${h}"
fill="#bd8950"
stroke="#80572d"
stroke-width="1.2"/>

`;
});


/* ============================================================
WINDOW TOP CRIPPLES
============================================================ */

[
windowTopCripple1Centre,
windowTopCripple2Centre
].forEach(centre => {

const x =
xFromMm(
centre - timber / 2
);

const y =
yFromMm(
wallHeight - timber
);

const h =
windowTopCrippleLength *
scale;

svg += `

<rect
x="${x}"
y="${y}"
width="${timberPx}"
height="${h}"
fill="#bd8950"
stroke="#80572d"
stroke-width="1.2"/>

`;
});

}


/* ============================================================
GAP DIMENSIONS
============================================================ */

mainStuds.forEach((stud, index) => {

if (
index >=
mainStuds.length - 1
) return;

const next =
mainStuds[index + 1];

const gap =
next.start -
(
stud.start +
timber
);

if (gap <= 0) return;

const x1 =
xFromMm(
stud.start +
timber
);

const x2 =
xFromMm(
next.start
);

const y =
bottomY + 28;

svg += `

<line
x1="${x1}"
y1="${y}"
x2="${x2}"
y2="${y}"
stroke="#111"
stroke-width="1"/>

<line
x1="${x1}"
y1="${y - 5}"
x2="${x1}"
y2="${y + 5}"
stroke="#111"/>

<line
x1="${x2}"
y1="${y - 5}"
x2="${x2}"
y2="${y + 5}"
stroke="#111"/>

<text
x="${(x1 + x2) / 2}"
y="${y + 15}"
text-anchor="middle"
font-family="Arial"
font-size="9"
font-weight="bold">
${Math.round(gap)} mm
</text>

`;
});


/* ============================================================
OVERALL DIMENSIONS
============================================================ */

svg += `

<line
x1="${x0}"
y1="${bottomY + 55}"
x2="${x0 + actualDrawingWidth}"
y2="${bottomY + 55}"
stroke="#111"
stroke-width="1.5"/>

<line
x1="${x0}"
y1="${bottomY + 48}"
x2="${x0}"
y2="${bottomY + 62}"
stroke="#111"/>

<line
x1="${x0 + actualDrawingWidth}"
y1="${bottomY + 48}"
x2="${x0 + actualDrawingWidth}"
y2="${bottomY + 62}"
stroke="#111"/>

<text
x="${x0 + actualDrawingWidth / 2}"
y="${bottomY + 75}"
text-anchor="middle"
font-family="Arial"
font-size="12"
font-weight="bold">
OVERALL LENGTH: ${wallLength} mm
</text>

<line
x1="${x0 - 45}"
y1="${topY}"
x2="${x0 - 45}"
y2="${bottomY}"
stroke="#111"
stroke-width="1.5"/>

<line
x1="${x0 - 52}"
y1="${topY}"
x2="${x0 - 38}"
y2="${topY}"
stroke="#111"/>

<line
x1="${x0 - 52}"
y1="${bottomY}"
x2="${x0 - 38}"
y2="${bottomY}"
stroke="#111"/>

<text
x="${x0 - 60}"
y="${(topY + bottomY) / 2}"
text-anchor="middle"
font-family="Arial"
font-size="12"
font-weight="bold"
transform="rotate(-90 ${x0 - 60} ${(topY + bottomY) / 2})">
OVERALL HEIGHT: ${wallHeight} mm
</text>

</svg>
`;


/* ============================================================
TABLES
============================================================ */

let html = `

<h3>Starting Positions of Main Wall Studs</h3>

<div class="note">

<thead>
<tr>
<th>Stud</th>

<th>Timber Width (mm)</th>
<th>End Position (mm)</th>
<th>Gap To Next Stud (mm)</th>
</tr>
</thead>

<tbody>
`;


mainStudTable.forEach(stud => {

html += `

<tr>
<td>${stud.name}</td>
<td>${mm(stud.start)}</td>
<td>${timber}</td>
<td>${mm(stud.start + timber)}</td>
<td>
${
stud.gapToNext === ""
?
"—"
:
stud.gapToNext
}
</td>
</tr>

`;
});


html += `
</tbody>
</table>
</div>


<h3>Door & Window Framing Positions</h3>

<div class="table-wrap">

</tr>

<td>${Math.max(0, mm(doorCrippleLength))}</td>
<td>Above door header</td>
</tr>
`;


if (windowInclude === "yes") {

html += `

<tr>
<td>Window Left Frame</td>

<td>${wallHeight}</td>

</tr>

</tr>

</tr>

<tr>
<td>Window Bottom Cripple 2</td>
<td>${mm(windowBottomCripple2Centre - timber / 2)}</td>
<td>${Math.max(0, mm(windowBottomCrippleLength))}</td>
<td>Below window opening</td>
</tr>

<tr>
<td>Window Top Cripple 1</td>
<td>${mm(windowTopCripple1Centre - timber / 2)}</td>
<td>${Math.max(0, mm(windowTopCrippleLength))}</td>

</tr>

<tr>

</tr>

`;
}


html += `

</table>
</div>

if (windowInclude === "yes") {

</tr>

`;
}

</div>
