<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timber Craft Works</title>

<style>

/* RESET */
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

/* PAGE */
html {
scroll-behavior: smooth;
}

body {
font-family: Arial, Helvetica, sans-serif;
background: #ffffff;
color: #222222;
line-height: 1.6;
min-height: 100vh;
display: flex;
flex-direction: column;
}

/* HEADER */
header {
width: 100%;
background-color: #000000;
color: #ffffff;
text-align: center;
padding: 30px 15px;
}

header h1 {
color: #ffffff;
font-size: clamp(28px, 5vw, 46px);
font-weight: bold;
letter-spacing: 2px;
margin: 0;
}

header p {
color: #ffffff;
font-size: 16px;
margin-top: 8px;
}

/* MAIN CONTENT */
main {
width: 100%;
max-width: 1200px;
margin: 0 auto;
padding: 35px 20px;
flex: 1;
}

/* HEADINGS */
h2 {
font-size: clamp(22px, 4vw, 32px);
margin-bottom: 15px;
color: #222222;
}

h3 {
margin-bottom: 10px;
}

/* IMAGES */
img {
max-width: 100%;
height: auto;
display: block;
}

/* LINKS */
a {
color: #222222;
text-decoration: none;
}

a:hover {
text-decoration: underline;
}

/* BUTTONS */
button {
background-color: #000000;
color: #ffffff;
border: none;
padding: 12px 24px;
border-radius: 5px;
cursor: pointer;
font-size: 16px;
}

button:hover {
background-color: #333333;
}

/* SECTIONS */
section {
margin-bottom: 35px;
}

/* FOOTER */
footer {
width: 100%;
background-color: #000000;
color: #ffffff;
text-align: center;
padding: 25px 15px;
margin-top: auto;
}

footer p,
footer a {
color: #ffffff;
font-size: 14px;
}

/* MOBILE RESPONSIVE */
@media (max-width: 600px) {

header {
padding: 24px 12px;
}

header h1 {
letter-spacing: 1px;
}

main {
padding: 25px 15px;
}

section {
margin-bottom: 25px;
}

button {
width: 100%;
}

}

/* JOIST CALCULATOR */

.joist-calculator {
max-width: 700px;
margin: 0 auto;
padding: 25px;
border: 1px solid #dddddd;
border-radius: 8px;
background-color: #ffffff;
}

.joist-calculator h2 {
margin-bottom: 10px;
}

.joist-calculator-intro {
margin-bottom: 25px;
}

.joist-input-group {
margin-bottom: 18px;
}

.joist-input-group label {
display: block;
font-weight: bold;
margin-bottom: 6px;
}

.joist-input-group input {
width: 100%;
padding: 12px;
border: 1px solid #aaaaaa;
border-radius: 5px;
font-size: 16px;
font-family: Arial, Helvetica, sans-serif;
}

.joist-input-group input:focus {
outline: none;
border-color: #000000;
}

.joist-calculate-button {
width: 100%;
margin-top: 5px;
}

.joist-error {
color: #b00020;
font-weight: bold;
margin-top: 15px;
}

.joist-results {
display: none;
margin-top: 30px;
}

.joist-summary {
background-color: #f2f2f2;
border-radius: 5px;
padding: 15px;
margin-bottom: 20px;
}

.joist-table-wrapper {
width: 100%;
overflow-x: auto;
}

.joist-results table {
width: 100%;
border-collapse: collapse;
min-width: 450px;
}

.joist-results th {
background-color: #000000;
color: #ffffff;
padding: 12px;
text-align: left;
}

.joist-results td {
padding: 12px;
border-bottom: 1px solid #dddddd;
}

.joist-results tr:nth-child(even) {
background-color: #f7f7f7;
}

@media (max-width: 600px) {

.joist-calculator {
padding: 20px 15px;
}

.joist-results table {
font-size: 14px;
}

}

</style>
</head>

<body>

<header>
<h1>Timber Craft Works</h1>
<p>Quality Woodworking, Garden Projects & Plans</p>
</header>

<main>

<!-- JOIST SPACING CALCULATOR -->

<section>

<div class="joist-calculator">

<h2>Joist Spacing Calculator</h2>

<p class="joist-calculator-intro">
Enter the floor length, joist thickness and number of joists.
All measurements are in millimetres (mm).
</p>

<div class="joist-input-group">

<label for="floorLength">
Floor Length (mm)
</label>

<input
type="number"
id="floorLength"
min="1"
step="1"
placeholder="e.g. 4000"
>

</div>

<div class="joist-input-group">

<label for="joistThickness">
Joist Thickness (mm)
</label>

<input
type="number"
id="joistThickness"
min="1"
step="1"
placeholder="e.g. 50"
>

</div>

<div class="joist-input-group">

<label for="numberOfJoists">
Number of Joists
</label>

<input
type="number"
id="numberOfJoists"
min="2"
step="1"
placeholder="e.g. 10"
>

</div>

<button
type="button"
class="joist-calculate-button"
onclick="calculateJoists()"
>
Calculate Joist Positions
</button>

<div id="joistError" class="joist-error"></div>

<div id="joistResults" class="joist-results">

<div id="joistSummary" class="joist-summary"></div>

<div class="joist-table-wrapper">

<table>

<thead>

<tr>
<th>Joist</th>
<th>Starting Position (mm)</th>
<th>Ending Position (mm)</th>
</tr>

</thead>

<tbody id="joistResultsTable">
</tbody>

</table>

</div>

</div>

</div>

</section>

<!-- YOUR WEBSITE CONTENT GOES HERE -->

</main>

<footer>
<p>© 2026 Timber Craft Works. All rights reserved.</p>
</footer>

<script>

function calculateJoists() {

const floorLength =
parseFloat(document.getElementById("floorLength").value);

const joistThickness =
parseFloat(document.getElementById("joistThickness").value);

const numberOfJoists =
parseInt(document.getElementById("numberOfJoists").value);

const error =
document.getElementById("joistError");

const results =
document.getElementById("joistResults");

const summary =
document.getElementById("joistSummary");

const table =
document.getElementById("joistResultsTable");

error.textContent = "";
results.style.display = "none";
table.innerHTML = "";

if (
isNaN(floorLength) ||
isNaN(joistThickness) ||
isNaN(numberOfJoists)
) {

error.textContent =
"Please enter all three values.";

return;

}

if (
floorLength <= 0 ||
joistThickness <= 0 ||
numberOfJoists < 2
) {

error.textContent =
"Please enter valid values. You need at least 2 joists.";

return;

}

const totalJoistThickness =
numberOfJoists * joistThickness;

const totalGap =
floorLength - totalJoistThickness;

if (totalGap < 0) {

error.textContent =
"The joists are too thick for the floor length.";

return;

}

const numberOfGaps =
numberOfJoists - 1;

const clearGap =
totalGap / numberOfGaps;

for (let i = 0; i < numberOfJoists; i++) {

const startingPosition =
i * (joistThickness + clearGap);

const endingPosition =
startingPosition + joistThickness;

const row =
document.createElement("tr");

row.innerHTML = `
<td>Joist ${i + 1}</td>
<td>${formatMillimetres(startingPosition)} mm</td>
<td>${formatMillimetres(endingPosition)} mm</td>
`;

table.appendChild(row);

}

summary.innerHTML = `
<strong>Floor Length:</strong>
${formatMillimetres(floorLength)} mm<br>

<strong>Joist Thickness:</strong>
${formatMillimetres(joistThickness)} mm<br>

<strong>Number of Joists:</strong>
${numberOfJoists}<br>

<strong>Clear Gap Between Joists:</strong>
${formatMillimetres(clearGap)} mm
`;

results.style.display = "block";

}

function formatMillimetres(number) {

return number.toLocaleString("en-GB", {
minimumFractionDigits: 0,
maximumFractionDigits: 2
});

}

</script>

</body>
</html>
